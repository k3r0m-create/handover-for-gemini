<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Handover for Gemini</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #ffffff;
        --raised: #f1f3f4;
        --border: #c4c7c5;
        --text: #1f1f1f;
        --muted: #5f6368;
        --accent: #0b57d0;
        --on-accent: #ffffff;
        --ok: #1e8e3e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #1e1f20;
          --raised: #2b2c2f;
          --border: #444746;
          --text: #e3e3e3;
          --muted: #9aa0a6;
          --accent: #a8c7fa;
          --on-accent: #062e6f;
          --ok: #81c995;
        }
      }

      * { box-sizing: border-box; }

      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        background: var(--surface);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
      }

      .sub {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 12px;
      }

      .field { margin-bottom: 16px; }

      label.block {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        background: var(--raised);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font: 13px system-ui, sans-serif;
      }

      textarea {
        resize: vertical;
        min-height: 130px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1.5;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .row input[type='checkbox'] {
        margin: 0;
        accent-color: var(--accent);
      }

      .row label { font-size: 13px; }

      .label-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: 13px system-ui, sans-serif;
        cursor: pointer;
      }

      button:hover { background: var(--raised); }

      button.primary {
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
        font-weight: 600;
      }

      button.link {
        padding: 0;
        border: none;
        background: none;
        color: var(--accent);
        font-size: 12px;
      }

      button.link:hover { background: none; text-decoration: underline; }

      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 4px;
      }

      #status {
        font-size: 12px;
        color: var(--ok);
        opacity: 0;
        transition: opacity 0.2s;
      }

      #status.visible { opacity: 1; }

      .hint {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="extName">Handover for Gemini</h1>
    <p class="sub" data-i18n="popupSub"></p>

    <div class="field">
      <label class="block" for="defaultScope" data-i18n="popupScopeLabel"></label>
      <select id="defaultScope">
        <option value="0"></option>
        <option value="50"></option>
        <option value="20"></option>
        <option value="10"></option>
      </select>
    </div>

    <div class="field row">
      <input type="checkbox" id="showDock" />
      <label for="showDock" data-i18n="popupShowDock"></label>
    </div>

    <div class="field">
      <div class="label-row">
        <label class="block" for="briefingPrompt" data-i18n="popupPromptLabel"></label>
        <button type="button" class="link" id="reset" data-i18n="popupReset"></button>
      </div>
      <textarea id="briefingPrompt" spellcheck="false"></textarea>
    </div>

    <footer>
      <button type="button" class="primary" id="save" data-i18n="popupSave"></button>
      <span id="status"></span>
    </footer>

    <p class="hint" data-i18n="popupHint"></p>

    <script src="popup.js"></script>
  </body>
</html>
